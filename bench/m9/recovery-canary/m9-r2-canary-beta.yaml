host_project:
  root: ${M9_R2_CANARY_BETA_PROJECT}
  origin: https://github.com/android/architecture-samples.git
  commit: ee66e1526b84c026615df032c705842b7d2a521f
apk_glob: app/build/outputs/apk/debug/app-debug.apk
package: com.example.android.architecture.blueprints.main
activity: com.example.android.architecture.blueprints.todoapp.TodoActivity
scenario:
  id: m9-r2-canary-beta
  user_actions:
  - Open the task list
  - Create a task titled R2 BETA ORIGINAL with description R2 BETA DESCRIPTION
  - Edit the task title to R2 BETA EDITED
  - Navigate back to the task list
  - Reopen the task titled R2 BETA EDITED
  system_events:
  - step_index: 4
    event: process_death
  l2_boundary_index: 0
  l3_spec: The title R2 BETA EDITED remains visible after navigation, reopening,
    and the admitted process boundary.
