# Run Spec - Wikipedia navigation back-button swallowed seed (#16)
#
# Purpose: add an M2 navigation seed where Activity-level Back is consumed
# without crashing, so the user remains stuck in SearchActivity for one extra
# Back press. This complements wikipedia-navigation-01, which is an L1 crash
# seed for duplicate bottom-sheet navigation.
#
# Injection: SearchActivity's OnBackPressedCallback swallows the first
# Activity-level Back callback instead of delegating to onBackPressedDispatcher.
#
# Real-world source pattern: candidates.md N3 (Tusky search page Back was
# swallowed/inconsistent; fixed by routing hardware Back directly).
#
# L2 observation boundary: dark_mode is injected after the Back behavior so the
# existing before/after boundary assertion can check whether search_card is back
# on screen. The defect is triggered by Back, not by dark_mode.
#
# Run precondition used for live validation: after `pm clear`, preseed default
# shared prefs so transient host prompts do not obscure the boundary:
# initialOnboardingEnabled=false, exploreFeedUpdatePromptShown=true,
# yearInReviewVisited=true, isYearInReviewEnabled=false,
# searchWidgetInstallPromptShown=true, hybridSearchOnboardingShown=true.

host_project: /Users/80268204/hosts/wikipedia
apk_glob: app/build/outputs/apk/dev/debug/*.apk
package: org.wikipedia.dev
activity: org.wikipedia.DefaultIcon
diff: ../patches/wikipedia-navigation-02-back-button-swallowed.patch
spec: ../specs/wikipedia-navigation-02-back-button-swallowed.md

scenario:
  id: wikipedia-navigation-02-back-button-swallowed
  user_actions:
    - "org.wikipedia.dev is already launched by the runner or by setup; do not use launcher search or intents. If onboarding appears, tap Forward until Skip is available, then tap Skip. From the main feed, tap the bottom Search tab (nav_tab_search), then tap search_card to open SearchActivity."
    - "Tap search_src_text, type sentinel text 'zznavbackqx', and confirm search_src_text shows it. Press system Back once to hide the soft keyboard while staying in SearchActivity. Then press system Back a second time; this is the navigation Back and should return to the Search tab where search_card is visible."
  system_events:
    - step_index: 1
      event: dark_mode
      args:
        night: "yes"
  assertions:
    - resource_id: search_card
      attr: resource-id
      expected: search_card
  expected_behavior: >
    With the injected defect, the first Activity-level Back callback is swallowed
    after the soft keyboard has already been hidden. The app remains in
    SearchActivity instead of returning to the Search tab. The subsequent
    dark_mode boundary captures SearchActivity again, so search_card is absent
    and L2 outcome=fail under the current state_loss verdict class. No crash is
    expected, so L1 should remain inconclusive.
