# Run Spec - Wikipedia oversized saved-state crash seed (#23)
#
# Purpose: add an M2 process-death/save-state seed where Activity state saving
# itself crashes because an oversized payload is written into the instance-state
# Bundle. This complements process-death-02, which is silent L2 state loss after
# a real process death.
#
# Injection: SearchActivity.onSaveInstanceState() writes a 2 MiB byte array into
# the saved-state Bundle. When Android saves state at the uiMode boundary, Binder
# rejects the oversized transaction and reports TransactionTooLargeException.
#
# Real-world source pattern: candidates.md P2 (Tusky #419 saved a full Bitmap in
# onSaveInstanceState and crashed with TransactionTooLargeException when the app
# was backgrounded).
#
# Use dark_mode as the boundary because it already exercises SearchActivity state
# save/restore on this host. The defect is caught by L1 crash_stability; L2 is
# present only as a baseline sanity assertion when no crash happens.

host_project: /Users/80268204/hosts/wikipedia
apk_glob: app/build/outputs/apk/dev/debug/*.apk
package: org.wikipedia.dev
activity: org.wikipedia.DefaultIcon
diff: ../patches/wikipedia-process-death-03-oversized-saved-state.patch
spec: ../specs/wikipedia-process-death-03-oversized-saved-state.md

scenario:
  id: wikipedia-process-death-03-oversized-saved-state
  metric_context:
    seed_kind: injected_defect
    taxonomy_category: process-death
    taxonomy_pattern_id: process-death-03
    expected_oracle_level: L1
    expected_oracle_defect_class: crash_stability
  user_actions:
    - "org.wikipedia.dev is already launched by the runner or setup; do not use launcher search or intents. If onboarding appears, tap Forward until Skip is available, then tap Skip. From the main feed, tap the bottom Search tab (nav_tab_search), then tap search_card to open SearchActivity."
    - "Tap search_src_text, type sentinel text 'zzoversizeqx', and confirm search_src_text shows it. Press system Back once to hide the soft keyboard while staying in SearchActivity."
  system_events:
    - step_index: 1
      event: dark_mode
      args:
        night: "yes"
  assertions:
    - resource_id: search_src_text
      attr: text
      expected: zzoversizeqx
  expected_behavior: >
    With the injected defect, SearchActivity writes an oversized byte array into
    the saved-state Bundle during the dark-mode uiMode boundary. Android rejects
    the oversized saved-state Binder transaction with TransactionTooLargeException
    or the platform fatal wrapper around it. Expected L1 outcome=fail with
    defect_class_hypothesis=crash_stability. The baseline build does not write
    the oversized payload, so it should not emit an L1 crash signal under the
    same boundary.
