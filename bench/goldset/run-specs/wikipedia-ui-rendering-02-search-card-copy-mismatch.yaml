# Run Spec - Wikipedia ui-rendering-02 search card copy mismatch (#17)
#
# Purpose: add a second L3 semantic seed. The Search tab entry card keeps the
# same resource-id and screen structure, but renders copy from the wrong feature.
# L1/L2 are intentionally invisible; L3 judges the observed copy against the
# product spec.
#
# Injection: HistoryFragment.SearchCardViewHolder.updateSearchHint() uses
# R.string.history_empty_message for search_text_view/search_icon.
#
# L3 boundary: event-less final checkpoint on the bottom Search tab.
#
# Run precondition used for live validation: after `pm clear`, preseed default
# shared prefs so transient host prompts do not obscure the screen:
# initialOnboardingEnabled=false, exploreFeedUpdatePromptShown=true,
# yearInReviewVisited=true, isYearInReviewEnabled=false,
# searchWidgetInstallPromptShown=true, hybridSearchOnboardingShown=true.

host_project: /Users/80268204/hosts/wikipedia
apk_glob: app/build/outputs/apk/dev/debug/*.apk
package: org.wikipedia.dev
activity: org.wikipedia.DefaultIcon
diff: ../patches/wikipedia-ui-rendering-02-search-card-copy-mismatch.patch
spec: ../specs/wikipedia-ui-rendering-02-search-card-copy-mismatch.md

scenario:
  id: wikipedia-ui-rendering-02-search-card-copy-mismatch
  metric_context:
    seed_kind: injected_defect
    taxonomy_category: ui-rendering
    taxonomy_pattern_id: ui-rendering-02
    expected_oracle_level: L3
    expected_oracle_defect_class: ui_rendering
  user_actions:
    - "org.wikipedia.dev is already launched by the runner or by setup; do not use launcher search or intents. If onboarding appears, tap Forward until Skip is available, then tap Skip. From the main feed, tap the bottom Search tab (nav_tab_search) and stop there. Confirm the Search tab is selected and search_card is visible; do not tap search_card or enter SearchActivity."
  system_events: []
  assertions: []
  l3_spec: >
    On the bottom Search tab, the visible search entry card must describe the
    Search feature. The node with resource-id "search_card" should be visible, and
    its child text node "search_text_view" or icon content description
    "search_icon" should clearly invite the user to search Wikipedia or search/ask
    anything. It must not describe reading history, recently viewed articles,
    saved pages, edit activity, or any non-search feature. If the Search tab or
    search_card is not visible, return inconclusive rather than fail.
  expected_behavior: >
    Defect build: the Search tab opens normally and no node disappears, but
    search_text_view/search_icon show History copy ("Track what you've been reading
    here.") instead of Search copy. Expected oracle outcomes: L1 inconclusive, L2
    inconclusive/not applicable, L3 fail with defect_class_hypothesis=ui_rendering.
    Baseline build under the same scenario and same l3_spec should pass L3.
