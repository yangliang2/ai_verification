host_project: ../../../..
apk_glob: bench/fixtures/lifecycle-recovery-app/app/build/outputs/apk/debug/app-debug.apk
package: dev.aiverify.lifecyclefixture
activity: dev.aiverify.lifecyclefixture.CompatibilityActivity
spec: ../spec.md
live_validation:
  timeout_seconds: 30
  app_smoke: {target_resource_id: compatibility_create_state, app_settle_seconds: 1}
scenario:
  id: compatibility-phone-ar-landscape
  user_actions:
    - Tap the button with resource-id compatibility_create_state and verify the sentinel AIVERIFY-ISSUE-72-SENTINEL is visible.
    - After the locale event, inspect without interacting and verify the Arabic title and DIRECTION_RTL remain visible with the sentinel.
    - After rotation, inspect without interacting and verify the same Arabic RTL state remains visible.
    - After cleanup, verify the app locale is restored to en-US; do not modify fixture state.
  system_events:
    - {step_index: 0, event: locale_change, args: {locale: ar-EG}}
    - {step_index: 1, event: rotate, args: {rotation: "1"}}
    - {step_index: 2, event: locale_change, args: {locale: en-US}}
  l2_boundary_index: 1
  assertions:
    - {resource_id: compatibility_title, attr: text, expected: اختبار مصفوفة التوافق}
    - {resource_id: compatibility_direction, attr: text, expected: DIRECTION_RTL}
    - {resource_id: compatibility_state, attr: text, expected: AIVERIFY-ISSUE-72-SENTINEL}
  expected_behavior: Arabic phone landscape retains localized RTL layout and sentinel state.
  metric_context: {seed_kind: baseline_control, expected_oracle_level: L2, expected_oracle_defect_class: ui_rendering}
