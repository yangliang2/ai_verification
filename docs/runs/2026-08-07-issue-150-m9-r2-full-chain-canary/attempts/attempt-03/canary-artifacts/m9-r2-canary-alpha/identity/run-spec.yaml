host_project:
  root: ${M9_R2_CANARY_ALPHA_PROJECT}
  origin: https://github.com/android/architecture-samples.git
  commit: ee66e1526b84c026615df032c705842b7d2a521f
apk_glob: app/build/outputs/apk/debug/app-debug.apk
package: com.example.android.architecture.blueprints.main
activity: com.example.android.architecture.blueprints.todoapp.TodoActivity
scenario:
  id: m9-r2-canary-alpha
  user_actions:
  - Open the task list
  - Create a task titled r2a0 with description adesc
  - Edit the task title to r2a1
  - Navigate back to the task list
  - Reopen the same uniquely created task by tapping it, even if the displayed title
    is r2a0 rather than r2a1
  system_events:
  - step_index: 4
    event: process_death
  l2_boundary_index: 0
  l3_spec: The title r2a1 remains visible after navigation, reopening,
    and the admitted process boundary.
