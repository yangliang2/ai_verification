host_project:
  root: ${WIKIPEDIA_SOURCE}
  origin: https://github.com/wikimedia/apps-android-wikipedia
  commit: 6ccb8d85a21a8e34b96e4813d3caee5c690ece9b
apk_glob: app/build/outputs/apk/dev/debug/*.apk
package: org.wikipedia.dev
activity: org.wikipedia.DefaultIcon
diff: ../patches/wikipedia-navigation-02-back-button-swallowed.patch
spec: ../specs/wikipedia-navigation-02-back-button-swallowed.md
scenario:
  id: wikipedia-navigation-02-back-button-swallowed
  metric_context:
    seed_kind: injected_defect
    taxonomy_category: navigation
    taxonomy_pattern_id: navigation-02
    expected_oracle_level: L2
    expected_oracle_defect_class: state_loss
  user_actions:
    - "org.wikipedia.dev is already launched by the runner or by setup; do not use launcher search or intents. If onboarding appears, tap Forward until Skip is available, then tap Skip. From the main feed, tap the bottom Search tab (nav_tab_search), then tap search_card to open SearchActivity."
    - "Tap search_src_text, type sentinel text 'zznavbackqx', and confirm search_src_text shows it. Press system Back once to hide the soft keyboard while staying in SearchActivity. Then press system Back a second time; this is the navigation Back. After that command completes, do not judge the destination, press Back again, or navigate further; finish the segment so the runner can capture the observation for L2."
  system_events:
    - step_index: 1
      event: dark_mode
      args:
        night: "yes"
  assertions:
    - resource_id: search_card
      attr: resource-id
      expected: search_card
  expected_behavior: >
    With the injected defect, the first Activity-level Back callback is swallowed
    after the soft keyboard has already been hidden. The app remains in
    SearchActivity instead of returning to the Search tab. The subsequent
    dark_mode boundary captures SearchActivity again, so search_card is absent
    and L2 outcome=fail under the current state_loss verdict class. No crash is
    expected, so L1 should remain inconclusive.
