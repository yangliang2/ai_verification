host_project:
  root: ${WIKIPEDIA_SOURCE}
  origin: https://github.com/wikimedia/apps-android-wikipedia
  commit: 6ccb8d85a21a8e34b96e4813d3caee5c690ece9b
apk_glob: app/build/outputs/apk/dev/debug/*.apk
package: org.wikipedia.dev
activity: org.wikipedia.DefaultIcon
diff: ../patches/wikipedia-process-death-03-oversized-saved-state.patch
spec: ../specs/wikipedia-process-death-03-oversized-saved-state.md
scenario:
  id: wikipedia-process-death-03-oversized-saved-state
  metric_context:
    seed_kind: injected_defect
    taxonomy_category: process-death
    taxonomy_pattern_id: process-death-03
    expected_oracle_level: L1
    expected_oracle_defect_class: crash_stability
  user_actions:
    - "org.wikipedia.dev is already launched by the runner or setup; do not use launcher search or intents. If onboarding appears, tap Forward until Skip is available, then tap Skip. From the main feed, tap the bottom Search tab (nav_tab_search), then tap search_card to open SearchActivity."
    - "Tap search_src_text, type sentinel text 'zzoversize', and confirm search_src_text shows it. Press system Back once to hide the soft keyboard while staying in SearchActivity."
  system_events:
    - step_index: 1
      event: app_to_background
  assertions: []
  expected_behavior: >
    With the injected defect, SearchActivity writes an oversized byte array into
    the saved-state Bundle while the Activity is backgrounded. Android rejects
    the oversized saved-state Binder transaction with TransactionTooLargeException
    or the platform fatal wrapper around it. Expected L1 outcome=fail with
    defect_class_hypothesis=crash_stability. The baseline build does not write
    the oversized payload, so it should not emit an L1 crash signal under the
    same boundary. L2 state assertions are intentionally empty because the
    post-boundary surface is the launcher rather than SearchActivity.
