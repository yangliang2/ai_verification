host_project:
  root: ${WIKIPEDIA_SOURCE}
  origin: https://github.com/wikimedia/apps-android-wikipedia
  commit: 6ccb8d85a21a8e34b96e4813d3caee5c690ece9b
apk_glob: app/build/outputs/apk/dev/debug/*.apk
package: org.wikipedia.dev
activity: org.wikipedia.permission.PermissionFixtureActivity
diff: ../patches/wikipedia-location-permission-baseline.patch
spec: ../specs/wikipedia-location-permission.md
scenario:
  id: wikipedia-location-permission-baseline
  user_actions:
    - "Confirm the Runtime location permission fixture is visible. Do not request permission yet."
    - "Tap Request location permission. In the real Android permission dialog, tap Don't allow. Return to the fixture and record the exact status, RATIONALE value, and visible controls."
    - "Tap Request location permission a second time. If Android displays a permission dialog, tap Don't allow. Return to the fixture and record the exact status, RATIONALE value, and visible controls."
    - "Inspect and record the exact status, RATIONALE value, and whether Continue without location and Open app Settings are visible."
    - "Tap Refresh permission state, then tap Use location feature. Record the exact status and confirm the fixture remains responsive."
    - "Tap Refresh permission state. Record the exact status, RATIONALE value, and visible controls without tapping Use location feature."
  system_events:
    - step_index: 0
      event: reset_permission
      args:
        permission: android.permission.ACCESS_FINE_LOCATION
    - step_index: 0
      event: reset_permission
      args:
        permission: android.permission.ACCESS_COARSE_LOCATION
    - step_index: 1
      event: observe_permission
      args:
        permission: android.permission.ACCESS_FINE_LOCATION
        expected_granted: "false"
        required_flags: USER_SET
        forbidden_flags: USER_FIXED
    - step_index: 2
      event: observe_permission
      args:
        permission: android.permission.ACCESS_FINE_LOCATION
        expected_granted: "false"
        required_flags: USER_SET,USER_FIXED
    - step_index: 3
      event: grant_permission
      args:
        permission: android.permission.ACCESS_FINE_LOCATION
    - step_index: 4
      event: revoke_permission
      args:
        permission: android.permission.ACCESS_FINE_LOCATION
  l2_boundary_index: 2
  assertions:
    - resource_id: permission_status
      attr: text
      expected: "FIRST_DENIED: Continue without location; retry is optional."
  expected_behavior: >
    Runtime location permission is optional. First denial leaves a retry and a
    continue-without-location fallback. Permanent denial adds a Settings route.
    Grant enables the location seam. Revocation is rechecked before access and
    leaves the fixture responsive with an explicit fallback.
  l3_spec: >
    Runtime location permission is optional. Denial and Settings revocation must
    never crash or trap the user. First denial must retain an explicit usable
    fallback; permanent denial must also expose an app Settings route; revoked
    access must be rechecked and degrade without LocationManager access.
