[project]
name = "aiverify"
version = "0.1.0"
description = "AI-driven behavior-layer verification for AI-generated Android code"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "coverage>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aiverify.agent.planner" = ["plan_schema.json"]
"aiverify.agent.oracle" = ["verdict_schema.json"]
"aiverify.runner" = ["journey_result_schema.json"]
"aiverify.bench" = [
    "m9_falsification_review_schema.json",
    "m6_cohort_schema.json",
    "m6_case_package_schema.json",
    "m7_qualification_schema.json",
    "m7_runtime_probe_schema.json",
    "m7_project_runtime_probe_schema.json",
    "m8_qualification_schema.json",
    "state_evolution_schema.json",
]
"aiverify.discovery" = ["discovery_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["aiverify"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.json]
pretty_print = true
