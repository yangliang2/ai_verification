[project]
name = "aiverify"
version = "0.1.0"
description = "AI-driven behavior-layer verification for AI-generated Android code"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aiverify.agent.planner" = ["plan_schema.json"]
"aiverify.agent.oracle" = ["verdict_schema.json"]
"aiverify.runner" = ["journey_result_schema.json"]
"aiverify.bench" = ["m6_cohort_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
